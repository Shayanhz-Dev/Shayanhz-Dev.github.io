
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0d12">
  <meta name="description" content="Shayan Hasanzadeh | Software Engineering, AI & Automation">
  <title>Shayan Hasanzadeh | Links</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d12;
      --surface: #121620;
      --surface-hover: #191f2b;
      --text: #f2f5fa;
      --muted: #9aa5b5;
      --accent: #9b8cff;
      --border: #252c39;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      padding: 24px 16px 40px;
      background:
        radial-gradient(
          ellipse at 50% 0%,
          rgba(116, 93, 255, 0.12),
          transparent 48%
        ),
        var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    .container {
      width: min(100%, 480px);
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 0 16px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      font-size: 1rem;
      font-weight: 750;
      letter-spacing: -0.04em;
    }

    .brand span {
      color: var(--accent);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 0.76rem;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #7dd9a7;
      box-shadow: 0 0 10px rgba(125, 217, 167, 0.3);
    }

    main {
      padding-top: 22px;
    }

    .profile {
      text-align: center;
    }

    .avatar {
      display: block;
      width: 108px;
      height: 108px;
      margin: 0 auto 16px;
      object-fit: cover;
      object-position: center;
      border-radius: 50%;
      border: 2px solid #37304f;
      background: var(--surface);
      box-shadow: 0 0 35px rgba(155, 140, 255, 0.12);
    }

    h1 {
      font-size: clamp(1.7rem, 6vw, 2.1rem);
      line-height: 1.2;
      letter-spacing: -0.055em;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .subtitle span {
      color: var(--accent);
    }

    .socials {
      display: grid;
      gap: 10px;
      margin-top: 24px;
    }

    .link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 52px;
      padding: 13px 17px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      font-size: 0.92rem;
      font-weight: 600;
      transition:
        transform 180ms ease,
        background 180ms ease,
        border-color 180ms ease;
    }

    .link:hover {
      transform: translateY(-2px);
      background: var(--surface-hover);
      border-color: #62568e;
    }

    .link.primary {
      background: var(--text);
      color: #11131a;
      border-color: var(--text);
    }

    .link.primary:hover {
      background: #dcd6ff;
      border-color: #dcd6ff;
    }

    .arrow {
      color: var(--muted);
      font-size: 1rem;
    }

    .link.primary .arrow {
      color: #11131a;
    }

    .technologies {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .section-title {
      margin-bottom: 14px;
      color: var(--muted);
      text-align: center;
      text-transform: uppercase;
      font-size: 0.73rem;
      font-weight: 750;
      letter-spacing: 0.15em;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .tag {
      padding: 7px 11px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(18, 22, 32, 0.8);
      color: #d6dbea;
      font-size: 0.82rem;
    }

    @media (max-width: 380px) {
      body {
        padding-inline: 12px;
      }

      .status {
        font-size: 0.68rem;
      }

      .avatar {
        width: 96px;
        height: 96px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <header>
      <a class="brand" href="#" aria-label="Home">
        SH<span>.</span>
      </a>

      <div class="status">
        <span class="status-dot" aria-hidden="true"></span>
        Software · AI · Automation
      </div>
    </header>

    <main>
      <section class="profile" aria-label="Profile">
        <img
          class="avatar"
          src="picture.png"
          alt="Shayan Hasanzadeh"
          width="108"
          height="108"
        >

        <h1>
          Shayan Hasanzadeh<span style="color: var(--accent)">.</span>
        </h1>

        <p class="subtitle">
          Software Engineering <span>·</span> AI <span>·</span> Automation
        </p>
      </section>

      <nav class="socials" aria-label="My links">
        <a
          class="link primary"
          href="https://github.com/Shayanhz-Dev"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span>GitHub</span>
          <span class="arrow">↗</span>
        </a>

        <a
          class="link"
          href="https://www.linkedin.com/in/shayan-hasanzade-8561a9366"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span>LinkedIn</span>
          <span class="arrow">↗</span>
        </a>

        <a
          class="link"
          href="https://x.com/DevShayanhz"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span>X (Twitter)</span>
          <span class="arrow">↗</span>
        </a>
      </nav>

      <section class="technologies" aria-labelledby="tech-title">
        <h2 class="section-title" id="tech-title">Technologies</h2>

        <div class="tags">
          <span class="tag">Python</span>
          <span class="tag">FastAPI</span>
          <span class="tag">SQL</span>
          <span class="tag">PostgreSQL</span>
          <span class="tag">SQLAlchemy</span>
          <span class="tag">Alembic</span>
          <span class="tag">Pandas</span>
          <span class="tag">NumPy</span>
          <span class="tag">REST APIs</span>
          <span class="tag">Git & GitHub</span>
        </div>
      </section>
    </main>

  </div>
</body>
</html>
