
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0d12">
  <meta name="description" content="Shayan Hasanzadeh — Social and professional links.">
  <title>Shayan Hasanzadeh | My Links</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d12;
      --surface: #121620;
      --surface-hover: #191f2b;
      --text: #f2f5fa;
      --muted: #9aa5b5;
      --accent: #9b8cff;
      --border: #252c39;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(116, 93, 255, 0.12), transparent 48%),
        var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 5px;
    }

    .container {
      width: min(100% - 40px, 920px);
      margin-inline: auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      font-weight: 750;
      font-size: 1.05rem;
      letter-spacing: -0.04em;
    }

    .brand span {
      color: var(--accent);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #7dd9a7;
      box-shadow: 0 0 12px rgba(125, 217, 167, 0.35);
    }

    main {
      padding: 28px 0 32px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1fr 150px;
      align-items: center;
      gap: 28px;
    }

    .eyebrow {
      color: var(--accent);
      text-transform: uppercase;
      font-size: 0.76rem;
      font-weight: 750;
      letter-spacing: 0.16em;
      margin-bottom: 8px;
    }

    h1 {
      font-size: clamp(2.4rem, 7vw, 4.2rem);
      line-height: 1.08;
      letter-spacing: -0.065em;
      margin-bottom: 12px;
    }

    .subtitle {
      color: var(--muted);
      font-size: clamp(1rem, 2.5vw, 1.15rem);
      max-width: 560px;
    }

    .subtitle strong {
      color: var(--text);
      font-weight: 600;
    }

    .avatar-wrap {
      justify-self: end;
    }

    .avatar {
      display: block;
      width: 144px;
      height: 144px;
      object-fit: cover;
      object-position: center;
      border-radius: 50%;
      border: 2px solid #37304f;
      background: var(--surface);
      box-shadow: 0 0 50px rgba(155, 140, 255, 0.13);
    }

    .socials {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 20px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 17px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      font-size: 0.9rem;
      font-weight: 650;
      transition: transform 180ms ease, background 180ms ease, border-color 180ms ease;
    }

    .button:hover {
      transform: translateY(-2px);
      background: var(--surface-hover);
      border-color: #62568e;
    }

    .button.primary {
      background: var(--text);
      color: #11131a;
      border-color: var(--text);
    }

    .button.primary:hover {
      background: #dcd6ff;
      border-color: #dcd6ff;
    }

    @media (max-width: 600px) {
      .container {
        width: min(100% - 32px, 920px);
      }

      header {
        padding: 14px 0;
      }

      .status {
        font-size: 0.72rem;
      }

      main {
        padding-top: 24px;
      }

      .hero {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .avatar-wrap {
        grid-row: 1;
        justify-self: start;
      }

      .avatar {
        width: 112px;
        height: 112px;
      }

      .socials {
        gap: 9px;
        margin-top: 18px;
      }

      .button {
        padding: 10px 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <a class="brand" href="#" aria-label="Home">SH<span>.</span></a>

      <div class="status">
        <span class="status-dot" aria-hidden="true"></span>
        Software · AI · Automation
      </div>
    </header>

    <main>
      <section class="hero" aria-labelledby="hero-title">
        <div>
          <p class="eyebrow">My Links</p>

          <h1 id="hero-title">
            Shayan<br>
            Hasanzadeh<span style="color: var(--accent)">.</span>
          </h1>

          <p class="subtitle">
            Software Engineering · AI · Automation
          </p>

          <nav class="socials" aria-label="Social and professional links">
            <a class="button primary"
               href="https://github.com/Shayanhz-Dev"
               target="_blank" rel="noopener noreferrer">GitHub ↗</a>

            <a class="button"
               href="https://www.linkedin.com/in/shayan-hasanzade-8561a9366"
               target="_blank" rel="noopener noreferrer">LinkedIn ↗</a>

            <a class="button"
               href="https://x.com/DevShayanhz"
               target="_blank" rel="noopener noreferrer">X ↗</a>
          </nav>
        </div>

        <div class="avatar-wrap">
          <img
            class="avatar"
            src="picture.png"
            alt="Portrait of Shayan Hasanzadeh"
            width="144"
            height="144"
          >
        </div>
      </section>
    </main>
  </div>
</body>
</html>
